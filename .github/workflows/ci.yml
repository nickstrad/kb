name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # nightly model tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: macos-14 # arm64; macOS only, no Linux test job (DEFAULTS #9)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true # caches the module and build cache; the first cgo sqlite build takes ~2 min
      - run: go vet -tags fts5 ./...
      - run: go test -tags fts5 ./...
      - name: Agent indexes in sync
        run: go run ./.agent/scripts/index-check

  nightly-model:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build kb
        run: go build -tags fts5 -o "$RUNNER_TEMP/kb" ./cmd/kb
      - name: Download the embedding model
        run: |
          "$RUNNER_TEMP/kb" model pull
      - name: Model tests
        run: go test -tags fts5,model ./internal/embed/local/...
